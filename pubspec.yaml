name: todoapp
description: A Flutter app with clean architecture, offline-first, and production-ready setup.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # State Management
  flutter_riverpod: ^2.4.9
  riverpod_annotation: ^2.3.3

  # Navigation
  go_router: ^12.1.3

  # Network
  dio: ^5.4.0
  pretty_dio_logger: ^1.3.1

  # Local Storage
  isar: ^3.1.0+1
  isar_flutter_libs: ^3.1.0+1
  shared_preferences: ^2.2.2
  flutter_secure_storage: ^9.0.0

  # Dependency Injection
  get_it: ^7.6.4
  injectable: ^2.3.2

  # Environment
  flutter_dotenv: ^5.1.0

  # Error Tracking
  sentry_flutter: ^7.14.0

  # Code Generation
  freezed_annotation: ^2.4.1
  json_annotation: ^4.9.0

  # Utils
  equatable: ^2.0.5
  dartz: ^0.10.1
  # intl is provided by flutter_localizations, no need to declare it

  # Localization
  flutter_localizations:
    sdk: flutter
  # intl_utils: ^2.8.7  # Temporarily removed due to dependency conflict

  # Platform
  path_provider: ^2.1.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.1

  # Code Generation
  build_runner: ^2.4.7
  freezed: ^2.4.6
  json_serializable: ^6.7.1
  riverpod_generator: ^2.3.9
  isar_generator: ^3.1.0+1
  injectable_generator: ^2.4.1

flutter:
  uses-material-design: true

  # Assets
  assets:
    - .env.dev
    - .env.stage
    - .env.prod

  # Localization
  generate: true
